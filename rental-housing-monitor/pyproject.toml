[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rental-housing-monitor"
version = "0.1.0"
description = "서울·경기 LH, SH, GH 임대주택 모집공고 모니터"
requires-python = ">=3.12"
dependencies = [
  "apify-fingerprint-datapoints==0.13.0",
  "beautifulsoup4>=4.12,<5",
  "browserforge==1.2.4",
  "cryptography>=45,<47",
  "croniter>=6.0,<7",
  "cssselect==1.4.0",
  "curl-cffi==0.15.0",
  "httpx>=0.27,<1",
  "idna>=3.10,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "regex>=2024.11,<2027",
  "scrapling[fetchers]==0.4.12",
  "tenacity>=8.2,<10",
]

[project.scripts]
personal-monitor = "personal_monitor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-httpx>=0.30,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: launches the locally installed Scrapling browser against loopback fixtures only",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rental_monitor", "src/personal_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
